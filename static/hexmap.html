  </footer>

<script>

class HexTypeAttributes {
  constructor( text, bg, fg ) {
    this.text = text;
    this.bg = bg;
    this.fg = fg;
  }
}

const hex_attributes_by_type = {
  'unknown'  : new HexTypeAttributes('Unknown'     , 'darkgray',      'black'),
  'arctic'   : new HexTypeAttributes('Arctic'      , 'snow',          'black'),
  'badlands' : new HexTypeAttributes('Badlands'    , 'orange',        'white'),
  'coastal'  : new HexTypeAttributes('Coastal'     , 'sandybrown',    'black'),
  'desert'   : new HexTypeAttributes('Desert'      , 'yellow',        'black'),
  'farmland' : new HexTypeAttributes('Farmland'    , 'wheat',         'black'),
  'forest'   : new HexTypeAttributes('Forest'      , 'forestgreen',   'white'),
  'grassland': new HexTypeAttributes('Grassland'   , 'lime',          'black'),
  'hills'    : new HexTypeAttributes('Hills'       , 'peru',          'white'),
  'mountains': new HexTypeAttributes('Mountains'   , 'brown',         'white'),
  'swamp'    : new HexTypeAttributes('Swamp'       , 'gray',          'black'),
  'urban'    : new HexTypeAttributes('Urban'       , 'silver',        'black'),
  'deepwater': new HexTypeAttributes('Deep Water'  , 'navy',          'white'),
  'shallows' : new HexTypeAttributes('Shallows'    , 'aqua',          'black'),
  'river9'   : new HexTypeAttributes('River N:S'   , 'aqua',          'black'),
  'river18'  : new HexTypeAttributes('River SW:NE' , 'aqua',          'black'),
  'river36'  : new HexTypeAttributes('River NW:SE' , 'aqua',          'black'),
};

const hex_types = Object.keys(hex_attributes_by_type);

function drag_start(event) {
    document.body.style.cursor = 'grabbing';
    event.dataTransfer.setDragImage(new Image(),0,0);

    const style = getComputedStyle(event.target);
    const data = {
      'id': event.target.id,
      'x': parseInt(style.left) - event.clientX,
      'y': parseInt(style.top) - event.clientY
    }
    event.dataTransfer.setData('application/json', JSON.stringify(data));
}

function drag_over(event) {
    const data = JSON.parse(event.dataTransfer.getData('application/json'));
    var dm = document.getElementById(data.id);
    dm.parentNode.appendChild(dm);
    dm.style.left = (event.clientX + data.x) + 'px';
    dm.style.top = (event.clientY + data.y) + 'px';
    event.preventDefault();
}

function drop(event) {
    drag_over(event);
    document.body.style.cursor = 'auto';
}

function hexId(x, y) {
  return `${x}/${y}`;
}

function displayCordinates(x, y){
  return `${x}, ${y}`;
}

function handleMapSettingsDialogShow() {
  map_settings_dialog.showModal();
}

function handleMapSettingsDialogClose(){
}

function handleHexDialogClose() {
  if( hex_dialog.returnValue === "save" && hex_dialog_close_callback_id) {
    hex_map.hexes[hex_dialog_close_callback_id].handleHexDialogClose();
  }
  hex_dialog_close_callback_id = null;
}

function getRandomHexType() {
  return hex_types[(Math.random() * hex_types.length) | 0];
}

class HexData {
  constructor( x, y, hexType = 'unknown', content = null ) {
    this.x = x;
    this.y = y;
    this.btn = document.createElement("BUTTON");
    if( content ) {
      this.notes = content;
    } else {
      this.notes = '';
    }
    this.btn.textContent = displayCordinates(x, y);
    this.btn.id = hexId(x, y);
    this.btn.classList.add('hex');
    //this.setHexType(getRandomHexType());
    this.setHexType(hexType);
    this.btn.addEventListener("click", () => this.handleClick() );
  }

  setHexType(hex_type) {
    if( !Object.hasOwn(hex_attributes_by_type, hex_type) ) {
      hex_type = 'unknown'
    }
    if (this.type) {
      this.btn.classList.remove(this.type);
    }
    this.type = hex_type;
    this.btn.classList.add(hex_type);
    let attr = hex_attributes_by_type[hex_type];
    if (this.notes) {
      this.btn.title=attr.text+"\n"+this.notes.split("\n")[0];
    } else {
      this.btn.title=attr.text;
    }
    this.btn.style.backgroundColor = attr.bg;
    this.btn.style.color = attr.fg;
  }

  handleClick() {
    hex_dialog_id.value = this.btn.id;
    hex_dialog_textarea.value = this.notes;
    hex_dialog_select.value = this.type;

    hex_dialog_close_callback_id = this.btn.id;

    hex_dialog.showModal();
  }

  handleHexDialogClose() {
    if ( this.notes != hex_dialog_textarea.value ||
         this.type != hex_dialog_select.value ) {
      this.notes = hex_dialog_textarea.value;
      this.setHexType(hex_dialog_select.value);
      this.saveHex();
    }
  }

  async saveHex() {
    const content = {
      "type": this.type,
      "notes": this.notes
    }

    const response = await saveHex(
                            map_settings_dialog_filename.value,
                            this.x,
                            this.y,
                            JSON.stringify(content)
                          );

    console.debug(`Save response: ${JSON.stringify(response, null, 2)}`);
  }
}



class HexMap {
  constructor(view_params, maxX=16, maxY=16, minX=0, minY=0, mapCells = null, defaultHexData=null ) {
    this.hexes = [];
    this.scrollBox = document.createElement("DIV");
    this.scrollBox.classList.add('scroll_box');
    let map = document.createElement("DIV");
    this.mapElement = map;
    map.classList.add('map');
    map.id="thehexmap";
    for (let x = minX; x <= maxX; ++x) {
      let d = document.createElement("DIV");
      if( x % 2 ) {
        d.classList.add('map_column_odd');
      } else {
        d.classList.add('map_column_even');
      }
      for (let y = maxY; y >= minY; --y) {
        let cellId = hexId(x,y);
        let cell = Object.hasOwn(mapCells, cellId) ? JSON.parse(mapCells[cellId]) : defaultHexData;
        let type = Object.hasOwn(cell, "type") ? cell["type"] : "unknown";
        let notes = Object.hasOwn(cell, "notes") ? cell["notes"] : null;
        //console.log(type, notes)
        let b = new HexData(x, y, type, notes);
        this.hexes[cellId] = b;
        d.appendChild(b.btn);
      }
      map.appendChild(d);
    }
    this.scrollBox.appendChild(map);
    document.body.appendChild(this.scrollBox);
    this.updateFullscale();
    if (view_params.zoom == null) {
      this.setZoom(this.fullscale);
    } else {
      this.setZoom(view_params.zoom);
    }
    this.mapElement.style.left = (-view_params.x) + "px";
    this.mapElement.style.top = (-view_params.y) + "px";

    this.scrollBox.addEventListener('dragover',drag_over);
    this.scrollBox.addEventListener('drop',drop);
    map.addEventListener("dragstart", drag_start);
    map.draggable=true;
    this.scrollBox.addEventListener("wheel", (evt) => {
      if( evt.wheelDelta > 0 )
      {
        this.zoomIn();
      } else {
        this.zoomOut();
      }
    });
    document.body.addEventListener("keydown", (evt) => {
      switch(evt.key)
      {
        case 'ArrowUp':
          var oldTop = parseInt(getComputedStyle(this.mapElement).top);
          this.mapElement.style.top = (oldTop - 5) + "px";
          break;

        case 'ArrowDown':
          var oldTop = parseInt(getComputedStyle(this.mapElement).top);
          this.mapElement.style.top = (oldTop + 5) + "px";
          break;

        case 'ArrowLeft':
          var oldLeft = parseInt(getComputedStyle(this.mapElement).left);
          this.mapElement.style.left = (oldLeft - 5) + "px";
          break;

        case 'ArrowRight':
          var oldLeft = parseInt(getComputedStyle(this.mapElement).left);
          this.mapElement.style.left = (oldLeft + 5) + "px";
          break;

        case '+':
        case '=':
          this.zoomIn();
          break;

        case '-':
        case '_':
          this.zoomOut();
          break;
      }
    });
  }

  updateFullscale() {
    let heightScale = this.scrollBox.clientHeight / this.mapElement.offsetHeight;
    let widthScale = this.scrollBox.clientWidth / this.mapElement.offsetWidth;
    //console.log(`SB:${this.scrollBox.clientWidth}x${this.scrollBox.clientHeight} ME:${this.mapElement.offsetWidth}x${this.mapElement.offsetHeight}`);
    this.fullscale = Math.min(widthScale, heightScale);
  }


  resize() {
    if (this.zoom == this.fullscale)
    {
      this.updateFullscale();
      this.setZoom(this.fullscale);
    } else {
      this.updateFullscale();
    }
  }

  updateMapData(maxX, maxY, minX, minY, mapCells, defaultHexData) {
    for (let cellId in this.hexes) {
        let b = this.hexes[cellId];

        let cell = Object.hasOwn(mapCells, cellId) ? JSON.parse(mapCells[cellId]) : defaultHexData;
        let type = Object.hasOwn(cell, "type") ? cell["type"] : "unknown";
        let notes = Object.hasOwn(cell, "notes") ? cell["notes"] : null;
        //console.log(type, notes)

        if(hex_dialog_close_callback_id == cellId &&
           (type != b.type || notes != b.notes) ) {
          alert("Another user has updated this hex.\n" +
                "Cancel your edits to keep their updates.\n" +
                "The updates: ("+mapCells[cellId]+")");
        }

        b.notes = notes;
        b.setHexType(type);
    }
  }

  setZoom(z) {
    if(z>10) z=10;
    if(z<0.1) z=0.1;
    if( (1/1.1 < z) && (z < 1*1.1) ) z = 1;
    if( (this.fullscale/1.1 < z) && (z < this.fullscale*1.1) ) z = this.fullscale;
    this.mapElement.style.transform = "scale(" + z + ")";
    this.zoom = z;
  }

  zoomIn() {
    this.setZoom(this.zoom*1.1);
  }

  zoomOut() {
    this.setZoom(this.zoom/1.1);
  }

  getHexData( x, y ) {
    return this.hexes[hexId(x,y)];
  }
}

function populateHexDialogSelect() {
  hex_types.forEach(hex_type => {
    const option = document.createElement("OPTION");
    const attr = hex_attributes_by_type[hex_type];
    option.style.backgroundColor = attr.bg;
    option.style.color = attr.fg;
    option.textContent = attr.text;
    option.value = hex_type;
    hex_dialog_select.appendChild(option);
  });

  hex_dialog.addEventListener("close", handleHexDialogClose );
}

function setTitle(title) {
  map_title_heading.textContent = title;
  map_heading_title.textContent = title;
}

function reloadMap() {
  loadMap(map_settings_dialog_filename.value).then(map => {
    setTitle(map["title"]);
    map_settings_dialog_version.value = map["version"];
    map_settings_dialog_rows.value = map["max_y"] - map["min_y"];
    map_settings_dialog_cols.value = map["max_x"] - map["min_x"];

    hex_map.updateMapData(map["max_x"], map["max_y"], map["min_x"], map["min_y"],
      map["cells"], JSON.parse(map["default"]));
  });
}

function updateMap() {
  if(!document.hidden && !suspend_updates) {
    getMapVersion(map_settings_dialog_filename.value).then( version => {
      if (version != map_settings_dialog_version.value ) {
        reloadMap();
      }
    });
  }
}


var updateTimer = setInterval(updateMap, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    updateMap();
    clearInterval(updateTimer);
    updateTimer = setInterval(updateMap, 3000);
  } else {
    clearInterval(updateTimer);
  }
});

var map_version = -1;

if (params.has('viewy')) {

  const mapFilename = params.get('map');

  loadMap(mapFilename).then(map => {
    setTitle(map["title"]);
    map_settings_dialog_version.value = map["version"];
    map_settings_dialog_rows.value = map["max_y"] - map["min_y"];
    map_settings_dialog_cols.value = map["max_x"] - map["min_x"];

    hex_map = new HexMap(view_params, map["max_x"], map["max_y"], map["min_x"], map["min_y"],
      map["cells"], JSON.parse(map["default"]));
  });

} else {
  const MAP_X = 40;
  const MAP_Y = 51;
  setTitle("The Map");
  hex_map = new HexMap(view_params,MAP_X, MAP_Y);
}
