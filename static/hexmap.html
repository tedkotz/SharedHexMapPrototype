<!DOCTYPE html>
<html>
<head>
  <title id="heading_title" ></title>
  <link rel="stylesheet" href="hexmap.css" />
  <script type="text/javascript" src="/map_api.js"></script>
</head>
<body>

<h1 id="title_heading" onclick="handleMapSettingsDialogShow()"></h1>

<dialog id="hex_dialog" title="Basic dialog">
  <header>
    <button onclick="hex_dialog.close('cancel')">X</button>
    <h2>Edit Tile</h2>
  </header>

  <form>
    <label for="hex_dialog_id">Hex ID:</label>
    <input id="hex_dialog_id"></input>

    <label for="hex_dialog_select">Terrain: </label>
    <select id="hex_dialog_select"></select>

    <label for="hex_dialog_river">River: </label>
    <input id="hex_dialog_river"></input>

    <label>Notes:</label>
    <textarea id="hex_dialog_textarea" rows="20" cols="80" placeholder="Enter notes about this hex here."></textarea>
  </form>
  <footer>
    <button onclick="hex_dialog.close('cancel')">Cancel</button>
    <button class="primary" onclick="hex_dialog.close('save')">Save</button>
  </footer>
</dialog>

<dialog id="map_settings_dialog" title="Basic dialog">
  <header>
    <button onclick="map_settings_dialog.close('cancel')">X</button>
    <h2>Edit Tile</h2>
  </header>

  <form>
    <label for="map_settings_dialog_filename">Filename:</label>
    <input id="map_settings_dialog_filename" disabled></input>

    <label for="map_settings_dialog_rows">Rows:</label>
    <input id="map_settings_dialog_rows" disabled></input>

    <label for="map_settings_dialog_cols">Columns:</label>
    <input id="map_settings_dialog_cols" disabled></input>

    <label for="map_settings_dialog_version">Version:</label>
    <input id="map_settings_dialog_version" disabled></input>

  </form>
  <footer>
    <button onclick="map_settings_dialog.close('cancel')">Cancel</button>
    <button class="primary" onclick="map_settings_dialog.close('save')">Save</button>
  </footer>
</dialog>


</body>

<script>

class HexTypeAttributes {
  constructor( text, bg, fg ) {
    this.text = text;
    this.bg = bg;
    this.fg = fg;
  }
}

<!--  ❄️ ⛰️⛰︎ ᨒ  𖠰🏜️💀 💀☢️⚠️☣️  𓇼 𓆉 𓆝 𓆡 𓇼🏝️⛱️🌞    🏜️☀️⏳🔥 🏛️  🐟⛲ 💧 〰️♒ ✖  ->

const hex_attributes_by_type = {
  'unknown'  : new HexTypeAttributes('Unknown'     , 'darkgray',      'black'),
  'arctic'   : new HexTypeAttributes('Arctic'      , 'snow',          'black'),
  'badlands' : new HexTypeAttributes('Badlands'    , 'orange',        'white'),
  'coastal'  : new HexTypeAttributes('Coastal'     , 'sandybrown',    'black'),
  'desert'   : new HexTypeAttributes('Desert'      , 'yellow',        'black'),
  'farmland' : new HexTypeAttributes('Farmland'    , 'wheat',         'black'),
  'forest'   : new HexTypeAttributes('Forest'      , 'forestgreen',   'white'),
  'grassland': new HexTypeAttributes('Grassland'   , 'lime',          'black'),
  'hills'    : new HexTypeAttributes('Hills'       , 'peru',          'white'),
  'mountains': new HexTypeAttributes('Mountains'   , 'brown',         'white'),
  'swamp'    : new HexTypeAttributes('Swamp'       , 'gray',          'black'),
  'urban'    : new HexTypeAttributes('Urban'       , 'silver',        'black'),
  'deepwater': new HexTypeAttributes('Deep Water'  , 'navy',          'white'),
  'shallows' : new HexTypeAttributes('Shallows'    , 'aqua',          'black'),
};

const hex_types = Object.keys(hex_attributes_by_type);

function hexId(x, y) {
  return `${x}/${y}`;
}

function displayCordinates(x, y){
  return `${x}, ${y}`;
}

function handleMapSettingsDialogShow() {
  map_settings_dialog.showModal();
}

function handleMapSettingsDialogClose(){
}

function handleHexDialogClose() {
  if( hex_dialog.returnValue === "save" && hex_dialog_close_callback_id) {
    hex_map.hexes[hex_dialog_close_callback_id].handleHexDialogClose();
  }
  hex_dialog_close_callback_id = null;
}

function getRandomHexType() {
  return hex_types[(Math.random() * hex_types.length) | 0];
}

class HexData {
  constructor( x, y, hexType = 'unknown', content = null, river=0 ) {
    this.x = x;
    this.y = y;
    this.btn = document.createElement("BUTTON");
    if( content ) {
      this.notes = content;
    } else {
      this.notes = '';
    }
    this.btn.textContent = displayCordinates(x, y);
    this.btn.id = hexId(x, y);
    this.btn.classList.add('hex');
    //this.setHexType(getRandomHexType(), 0);
    this.setHexType(hexType, river);
    this.btn.addEventListener("click", () => this.handleClick() );
  }

  setHexType(hex_type, river) {
    if( !Object.hasOwn(hex_attributes_by_type, hex_type) ) {
      hex_type = 'unknown';
    }
    if ( this.type == hex_type && this.river==river) {
      return;
    }
    if (this.type) {
      this.btn.classList.remove(this.type);
    }
    this.type = hex_type;
    this.river = river;
    this.btn.classList.add(hex_type);
    let attr = hex_attributes_by_type[hex_type];
    if (this.notes) {
      this.btn.title=attr.text+"\n"+this.notes.split("\n")[0];
    } else {
      this.btn.title=attr.text;
    }
    this.btn.style.backgroundColor = attr.bg;
    this.btn.style.color = attr.fg;
    var background = `url('hex-${hex_type}.svg')`;
    // Add River and road overlays here
    for( var river_bit = 0; river_bit < 6; ++river_bit) {
      if( river & (1 << river_bit) ) {
        background = `url('hex-river${river_bit}.svg'), ` + background;
      }
    }
    this.btn.style.backgroundImage = background
  }

  handleClick() {
    hex_dialog_id.value = this.btn.id;
    hex_dialog_textarea.value = this.notes;
    hex_dialog_select.value = this.type;
    hex_dialog_river.value = `${this.river}`

    hex_dialog_close_callback_id = this.btn.id;

    hex_dialog.showModal();
  }

  handleHexDialogClose() {
    var river = parseInt(hex_dialog_river.value);
    if (isNaN(river) || river<0 || river>63) {
      river = this.river
    }
    if ( this.notes != hex_dialog_textarea.value ||
         this.type != hex_dialog_select.value ||
         this.river != river
         ) {
      this.notes = hex_dialog_textarea.value;
      this.setHexType(hex_dialog_select.value, river);
      this.saveHex();
    }
  }

  async saveHex() {
    const content = {
      "type": this.type,
      "notes": this.notes,
      "river": this.river
    }

    const response = await saveHex(
                            map_settings_dialog_filename.value,
                            this.x,
                            this.y,
                            JSON.stringify(content)
                          );

    console.debug(`Save response: ${JSON.stringify(response, null, 2)}`);
  }
}



class HexMap {
  constructor(view_params, maxX=16, maxY=16, minX=0, minY=0, mapCells = null, defaultHexData=null ) {
    this.hexes = [];
    this.scrollBox = document.createElement("DIV");
    this.scrollBox.classList.add('scroll_box');
    let map = document.createElement("DIV");
    this.mapElement = map;
    map.classList.add('map');
    map.id="thehexmap";
    for (let x = minX; x <= maxX; ++x) {
      let d = document.createElement("DIV");
      if( x % 2 ) {
        d.classList.add('map_column_odd');
      } else {
        d.classList.add('map_column_even');
      }
      for (let y = maxY; y >= minY; --y) {
        let cellId = hexId(x,y);
        let cell = Object.hasOwn(mapCells, cellId) ? JSON.parse(mapCells[cellId]) : defaultHexData;
        let type = Object.hasOwn(cell, "type") ? cell["type"] : "unknown";
        let notes = Object.hasOwn(cell, "notes") ? cell["notes"] : null;
        let river = Object.hasOwn(cell, "river") ? cell["river"] : 0;
        //console.log(type, notes)
        let b = new HexData(x, y, type, notes, river);
        this.hexes[cellId] = b;
        d.appendChild(b.btn);
      }
      map.appendChild(d);
    }
    this.scrollBox.appendChild(map);
    document.body.appendChild(this.scrollBox);
    this.tx=-view_params.x;
    this.ty=-view_params.y;
    this.updateFullscale();
    if (view_params.zoom == null) {
      this.setZoom(this.fullscale);
    } else {
      this.setZoom(view_params.zoom);
    }
    this.scrollBox.addEventListener('dragover',(event) => this.drag_over(event));
    this.scrollBox.addEventListener('drop',(event) => this.drop(event));
    this.scrollBox.addEventListener("dragstart", (event) => this.drag_start(event));
    this.scrollBox.draggable=true;
    this.scrollBox.addEventListener("wheel", (evt) => {
      if( evt.wheelDelta > 0 )
      {
        this.zoomIn();
      } else {
        this.zoomOut();
      }
    });
    document.body.addEventListener("keydown", (evt) => {
      switch(evt.key)
      {
        case 'ArrowUp':
          var oldTop = parseInt(getComputedStyle(this.mapElement).top);
          this.mapElement.style.top = (oldTop - 5) + "px";
          break;

        case 'ArrowDown':
          var oldTop = parseInt(getComputedStyle(this.mapElement).top);
          this.mapElement.style.top = (oldTop + 5) + "px";
          break;

        case 'ArrowLeft':
          var oldLeft = parseInt(getComputedStyle(this.mapElement).left);
          this.mapElement.style.left = (oldLeft - 5) + "px";
          break;

        case 'ArrowRight':
          var oldLeft = parseInt(getComputedStyle(this.mapElement).left);
          this.mapElement.style.left = (oldLeft + 5) + "px";
          break;

        case '+':
        case '=':
          this.zoomIn();
          break;

        case '-':
        case '_':
          this.zoomOut();
          break;
      }
    });

    map.getBoundingClientRect(); // Wait for the map to finish resizing
    map.style.transition = "transform 100ms ease"; // enable smooth animations
  }

  updateMapData(maxX, maxY, minX, minY, mapCells, defaultHexData) {
    for (let cellId in this.hexes) {
        let b = this.hexes[cellId];

        let cell = Object.hasOwn(mapCells, cellId) ? JSON.parse(mapCells[cellId]) : defaultHexData;
        let type = Object.hasOwn(cell, "type") ? cell["type"] : "unknown";
        let notes = Object.hasOwn(cell, "notes") ? cell["notes"] : null;
        let river = Object.hasOwn(cell, "river") ? cell["river"] : 0;
        //console.log(type, notes)

        if(hex_dialog_close_callback_id == cellId &&
           (type != b.type || notes != b.notes) ) {
          alert("Another user has updated this hex.\n" +
                "Cancel your edits to keep their updates.\n" +
                "The updates: ("+mapCells[cellId]+")");
        }

        b.notes = notes;
        b.setHexType(type, river);
    }
  }

  updateTransform () {
    this.mapElement.style.transform = `translate(${this.tx}px, ${this.ty}px) scale(${this.zoom})`;
  }

  setZoom(z) {
    if(z>10) z=10;
    if(z<0.1) z=0.1;
    if( (1/1.1 < z) && (z < 1*1.1) ) z = 1;
    if( (this.fullscale/1.1 < z) && (z < this.fullscale*1.1) ) z = this.fullscale;
    this.zoom = z;
    this.updateTransform();
  }

  updateFullscale() {
    let heightScale = this.scrollBox.clientHeight / this.mapElement.offsetHeight;
    let widthScale = this.scrollBox.clientWidth / this.mapElement.offsetWidth;
    //console.log(`SB:${this.scrollBox.clientWidth}x${this.scrollBox.clientHeight} ME:${this.mapElement.offsetWidth}x${this.mapElement.offsetHeight}`);
    this.fullscale = Math.min(widthScale, heightScale);
  }

  resize() {
    if (this.zoom == this.fullscale)
    {
      this.updateFullscale();
      this.setZoom(this.fullscale);
    } else {
      this.updateFullscale();
    }
  }

  zoomIn() {
    this.setZoom(this.zoom*1.1);
  }

  zoomOut() {
    this.setZoom(this.zoom/1.1);
  }

  setPos(x, y) {
    if( -2<=x && x<=2 ) {
      this.tx = 0;
    } else {
      this.tx = x;
    }
    if( -2<=y && y<=2 ) {
      this.ty = 0;
    } else {
      this.ty = y;
    }
    this.updateTransform();
  }

  drag_start(event) {
    document.body.style.cursor = 'grabbing';
    event.dataTransfer.setDragImage(new Image(),0,0);
    const data = {
      'x': this.tx-event.clientX,
      'y': this.ty-event.clientY
    }
    event.dataTransfer.setData('application/json', JSON.stringify(data));
  }

  drag_over(event) {
    const data = JSON.parse(event.dataTransfer.getData('application/json'));
    this.setPos(event.clientX + data.x, event.clientY + data.y);
    event.preventDefault();
  }

  drop(event) {
    this.drag_over(event);
    document.body.style.cursor = 'auto';
  }

  getHexData( x, y ) {
    return this.hexes[hexId(x,y)];
  }
}

function populateHexDialogSelect() {
  hex_types.forEach(hex_type => {
    const option = document.createElement("OPTION");
    const attr = hex_attributes_by_type[hex_type];
    option.style.backgroundColor = attr.bg;
    option.style.color = attr.fg;
    option.textContent = attr.text;
    option.value = hex_type;
    hex_dialog_select.appendChild(option);
  });

  hex_dialog.addEventListener("close", handleHexDialogClose );
}

function setTitle(title) {
  map_title_heading.textContent = title;
  map_heading_title.textContent = title;
}

function reloadMap() {
  loadMap(map_settings_dialog_filename.value).then(map => {
    setTitle(map["title"]);
    map_settings_dialog_version.value = map["version"];
    map_settings_dialog_rows.value = map["max_y"] - map["min_y"];
    map_settings_dialog_cols.value = map["max_x"] - map["min_x"];

    hex_map.updateMapData(map["max_x"], map["max_y"], map["min_x"], map["min_y"],
      map["cells"], JSON.parse(map["default"]));
  });
}

function updateMap() {
  if(!document.hidden && !suspend_updates) {
    getMapVersion(map_settings_dialog_filename.value).then( version => {
      if (version != map_settings_dialog_version.value ) {
        reloadMap();
      }
    });
  }
}


var updateTimer = setInterval(updateMap, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    updateMap();
    clearInterval(updateTimer);
    updateTimer = setInterval(updateMap, 3000);
  } else {
    clearInterval(updateTimer);
  }
});

var map_version = -1;
var hex_dialog_close_callback_id = null;
var suspend_updates=false;
const hex_dialog = document.getElementById('hex_dialog');
const hex_dialog_select = document.getElementById('hex_dialog_select');
const hex_dialog_river = document.getElementById('hex_dialog_river');
const hex_dialog_id = document.getElementById('hex_dialog_id');
const hex_dialog_textarea = document.getElementById('hex_dialog_textarea');
const map_settings_dialog  = document.getElementById('map_settings_dialog');
const map_settings_dialog_filename  = document.getElementById('map_settings_dialog_filename');
const map_settings_dialog_rows  = document.getElementById('map_settings_dialog_rows');
const map_settings_dialog_cols  = document.getElementById('map_settings_dialog_cols');
const map_settings_dialog_version  = document.getElementById('map_settings_dialog_version');

map_settings_dialog_version
const map_title_heading = document.getElementById('title_heading');
const map_heading_title = document.getElementById('heading_title');
populateHexDialogSelect();
map_settings_dialog.addEventListener("close", handleMapSettingsDialogClose );


const params = new URLSearchParams(window.location.hash.slice(1));
var view_params={
  zoom: null,
  x: 0,
  y: 0
};

if (params.has('zoom')) {
  view_params.zoom = Number(params.get('zoom'));
}

if (params.has('viewx')) {
  view_params.x = Number(params.get('viewx'));
}

if (params.has('viewy')) {
  view_params.y = Number(params.get('viewy'));
}

console.log(JSON.stringify(view_params));

var hex_map = {}

if (params.has('map')) {
  const mapFilename = params.get('map');
  map_settings_dialog_filename.value = mapFilename;

  loadMap(mapFilename).then(map => {
    setTitle(map["title"]);
    map_settings_dialog_version.value = map["version"];
    map_settings_dialog_rows.value = map["max_y"] - map["min_y"];
    map_settings_dialog_cols.value = map["max_x"] - map["min_x"];

    hex_map = new HexMap(view_params, map["max_x"], map["max_y"], map["min_x"], map["min_y"],
      map["cells"], JSON.parse(map["default"]));
  });

} else {
  const MAP_X = 40;
  const MAP_Y = 51;
  setTitle("The Map");
  hex_map = new HexMap(view_params,MAP_X, MAP_Y);
}


window.onresize = function() {
  hex_map.resize();
};


</script>
</html>
